name: Threads paylaşımı

on:
  # GitHub zamanlanmış çalıştırmaları geciktirebiliyor ya da hiç başlatmayabiliyor (19 Ekim'de 8 çalıştırmadan
  # yalnızca 2'si, saatlerce geç başladı). Bu yüzden bot her 15 dakikada bir yoklanır. Bot yalnızca saati gelmiş
  # gönderiyi paylaşır, aynı gönderi iki kez gitmez, yoklamaların çoğu birkaç saniyede "paylaşılacak bir şey yok" der.
  # Dakikalar saat başından uzak seçildi (GitHub'ın en yoğun anı). Kesin saat için README'deki dış tetikleyiciye bakın.
  schedule:
    - cron: '8,23,38,53 * * * *'
    - cron: '6 6 10 11 *'          # 10 Kasım 09:06: anma paylaşımı (09:05)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme: hiçbir şey paylaşma, token ve sıradaki paylaşımı göster'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main      # tetiklendiği anki değil en güncel state.json: art arda iki çalıştırma aynı gönderiyi atmasın

      - name: Sıradaki paylaşımı gönder
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 bot.py

      - name: Durumu kaydet
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "lingoof-bot"
          git config user.email "lingoof-bot@users.noreply.github.com"
          git add state.json config.json
          if ! git diff --cached --quiet; then
            git commit -m "Paylaşım durumu"
            for i in 1 2 3; do git push && break; git pull --rebase; done
          fi
