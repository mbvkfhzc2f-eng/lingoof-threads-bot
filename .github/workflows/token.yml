name: Threads token yenileme

# Uzun ömürlü Threads token'ı 60 gün geçerli; her yenilemede Meta yeni bir token verir ve süre yeniden 60 gün olur.
# Yeni token, THREADS_TOKEN secret'ından türetilen anahtarla şifrelenip GitHub Actions önbelleğine yazılır (token_store.py);
# paylaşım, istatistik ve yanıt iş akışları onu oradan açar. GH_PAT gerekmez; varsa secret da güncellenir.
# GitHub zamanlanmış çalıştırmaları atlayabildiği için üç günde bir denenir; biri kaçsa da token canlı kalır.
on:
  schedule:
    - cron: '41 3 */3 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Önbellekteki token
        uses: actions/cache/restore@v4
        with:
          path: .thtok
          key: thtok-${{ github.run_id }}
          restore-keys: thtok-

      - name: Token'ı yenile
        id: th
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: python3 token_store.py refresh

      - name: Yeni token'ı önbelleğe kaydet
        if: always() && steps.th.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: .thtok
          key: thtok-${{ github.run_id }}
